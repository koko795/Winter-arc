<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>冬の章 — Winter Arc OS</title><style>
:root{color-scheme:dark;--bg:#080808;--card:#111;--card2:#171717;--text:#f0ede7;--muted:#8d8a84;--line:#393733;--silver:#c6c2b9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#191919 0,#080808 42%);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.wrap{max-width:980px;margin:auto;padding:18px}.hero,.panel{border:1px solid var(--line);background:linear-gradient(145deg,#131313,#0d0d0d);position:relative}.hero:after,.panel:after{content:"";position:absolute;inset:7px;border:1px solid #252525;pointer-events:none}.hero{padding:38px 20px;text-align:center}.orn{letter-spacing:.5em;color:var(--muted)}h1{font-size:clamp(30px,7vw,56px);letter-spacing:.18em;margin:12px 0 5px}.en,.muted{color:var(--muted);font-size:12px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.nav button,.btn{border:1px solid var(--line);background:#111;padding:13px 10px;min-height:48px}.nav button.active{background:#e7e2d8;color:#0b0b0b}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.panel{padding:20px;margin-bottom:10px}.big{font-size:30px;font-weight:bold;margin-top:14px}.bar{height:8px;background:#2a2927;margin-top:8px}.fill{height:100%;background:var(--silver);width:0}.row{display:flex;gap:10px;align-items:center;border:1px solid var(--line);padding:12px;margin-top:9px;background:#0c0c0c}.row input[type=checkbox]{width:21px;height:21px;accent-color:#ddd}.field{width:100%;padding:12px;background:#0b0b0b;border:1px solid var(--line);margin-top:8px}.formgrid{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.quote{text-align:center;font-size:22px;line-height:1.6}.section-title{letter-spacing:.15em;text-transform:uppercase}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:13px}.install{display:none;margin-top:12px}.danger{border-color:#604343}.toast{min-height:20px;margin-top:8px;color:var(--muted);font-size:12px}@media(max-width:650px){.nav{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.wrap{padding:10px}.hero{padding:30px 14px}}
.metric{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.timer{text-align:center;font-size:clamp(38px,10vw,70px);letter-spacing:.08em;margin:20px 0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}.day{aspect-ratio:1;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;background:#0b0b0b}.day.done{background:#ddd;color:#080808}.day.off{opacity:.25}.xp{font-size:12px;letter-spacing:.08em}.countdown{font-size:22px;font-weight:bold}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.split{grid-template-columns:1fr}.calendar{gap:3px}.day{font-size:9px}}
</style></head><body><main class="wrap"><section class="hero"><div class="orn">◆ ◇ ◆</div><div class="muted">2026.10.01 — WINTER ARC</div><h1>冬の章</h1><strong>静かに強くなる。</strong><div class="en">Become stronger in silence.</div><div style="max-width:480px;margin:22px auto 0"><div class="small">全体進捗 / Overall progress <span id="overall">0%</span></div><div class="bar"><div id="overallBar" class="fill"></div></div></div><button id="installBtn" class="btn install">アプリをインストール / Install app</button></section><nav id="nav" class="nav"></nav><div id="pages"></div></main><script>
const SKEY='winterArcOS.v1';const defaultState={habits:[['早起き','Wake on time'],['運動','Train / move'],['読書','Read'],['学習','Deep study'],['水分','Hydrate'],['睡眠','Sleep on schedule']].map(x=>({jp:x[0],en:x[1],done:false})),big:[['最重要タスク','Most important task'],['身体を動かす','Move your body'],['未来のために学ぶ','Learn for your future']].map(x=>({jp:x[0],en:x[1],done:false})),study:[],goals:[],media:[],focus:0,score:5,journal:{a:'',b:'',c:''},quote:0,water:0,sleep:8,workouts:[],xp:0,exam:{name:'',date:''},timer:{minutes:25}};let state;try{state={...defaultState,...JSON.parse(localStorage.getItem(SKEY)||'{}')}}catch{state=structuredClone(defaultState)};const save=()=>localStorage.setItem(SKEY,JSON.stringify(state));const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};const pct=a=>a.length?Math.round(a.filter(x=>x.done).length/a.length*100):0;
const sections=[['home','本部','HQ'],['discipline','規律','Discipline'],['study','学習','Study'],['progress','進捗','Progress'],['goals','目標','Goals'],['journal','記録','Journal'],['media','映像','Series & Movies'],['body','身体','Body'],['timer','集中','Timer'],['calendar','暦','Calendar'],['rules','掟','Rules']];const nav=document.querySelector('#nav'),pages=document.querySelector('#pages');nav.innerHTML=sections.map((x,i)=>`<button data-page="${x[0]}" class="${i?'':'active'}"><b>${x[1]}</b><div class="en">${x[2]}</div></button>`).join('');pages.innerHTML=sections.map((x,i)=>`<section id="${x[0]}" class="page ${i?'':'active'}"></section>`).join('');nav.onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===b.dataset.page))};
const quotes=[['千里の道も一歩から。','A journey of a thousand miles begins with a single step.'],['継続は力なり。','Persistence becomes strength.'],['七転び八起き。','Fall seven times, stand up eight.'],['初心忘るべからず。','Never forget the beginner’s mind.'],['急がば回れ。','When in a hurry, take the steady path.']];
function render(){const d=pct(state.habits),s=pct(state.study),g=pct(state.goals),m=pct(state.media),o=Math.round((d+s+g+pct(state.big))/4);document.querySelector('#overall').textContent=o+'%';document.querySelector('#overallBar').style.width=o+'%';document.querySelector('#home').innerHTML=`<div class="grid"><div class="panel"><b>完了した習慣</b><div class="en">Habits completed</div><div class="big">${state.habits.filter(x=>x.done).length} / ${state.habits.length}</div></div><div class="panel"><b>集中時間</b><div class="en">Focus minutes</div><div class="big">${state.focus}</div></div><div class="panel"><b>規律スコア</b><div class="en">Discipline score</div><div class="big">${state.score}/10</div></div></div><div class="panel quote"><div class="muted">今日の言葉 / WORD OF THE DAY</div><p>${quotes[state.quote][0]}</p><div class="en">${quotes[state.quote][1]}</div><button class="btn" data-act="quote">次の言葉 / Next quote</button></div><div class="panel"><b>今日の三つ</b><div class="en">Today's Big Three</div>${rows(state.big,'big')}</div>`;document.querySelector('#discipline').innerHTML=`<div class="panel"><h2 class="section-title">規律 — Discipline</h2>${rows(state.habits,'habit')}</div><div class="panel"><b>今日の自己評価</b><div class="en">Daily discipline score</div><input class="field" id="score" type="range" min="1" max="10" value="${state.score}"><div>${state.score}/10</div></div>`;document.querySelector('#study').innerHTML=`<div class="panel"><h2 class="section-title">学習 — Study</h2><form id="studyForm" class="formgrid"><input class="field" name="subject" required placeholder="科目 / Subject"><input class="field" name="task" required placeholder="次の課題 / Next task"><button class="btn">追加 / Add</button></form>${state.study.length?rows(state.study,'study',x=>`<b>${esc(x.subject)}</b><div class="en">${esc(x.task)}</div>`):'<p class="muted">まだ課題はありません。 / No study tasks yet.</p>'}</div><div class="panel"><b>集中セッション</b><div class="en">Focus session</div><div class="actions"><button class="btn" data-focus="25">25 MIN</button><button class="btn" data-focus="50">50 MIN</button><button class="btn" data-focus="90">90 MIN</button></div></div>`;document.querySelector('#progress').innerHTML=`<div class="panel"><h2 class="section-title">進捗 — Progress</h2>${progress('規律 / Discipline',d)}${progress('学習 / Study',s)}${progress('目標 / Goals',g)}${progress('映像 / Media',m)}</div>`;document.querySelector('#goals').innerHTML=`<div class="panel"><h2 class="section-title">目標 — Goals</h2><form id="goalForm" class="formgrid" style="grid-template-columns:1fr auto"><input class="field" name="text" required placeholder="冬の目標 / Winter goal"><button class="btn">追加 / Add</button></form>${state.goals.length?rows(state.goals,'goal',x=>esc(x.text)):'<p class="muted">目標を追加してください。 / Add your first goal.</p>'}</div>`;document.querySelector('#journal').innerHTML=`<div class="panel"><h2 class="section-title">夜の記録 — Night Journal</h2><label>今日、何を成し遂げた？<div class="en">What did I accomplish today?</div><textarea class="field journal" data-j="a" rows="3">${esc(state.journal.a)}</textarea></label><label>何を改善する？<div class="en">What will I improve?</div><textarea class="field journal" data-j="b" rows="3">${esc(state.journal.b)}</textarea></label><label>明日の最優先事項<div class="en">Tomorrow's priority</div><textarea class="field journal" data-j="c" rows="2">${esc(state.journal.c)}</textarea></label><div class="toast">自動保存 / Auto-saved on this device</div></div>`;document.querySelector('#media').innerHTML=`<div class="panel"><h2 class="section-title">映像記録 — Watchlist</h2><form id="mediaForm" class="formgrid"><input class="field" name="title" required placeholder="作品名 / Title"><select class="field" name="type"><option>Series</option><option>Movie</option><option>Anime</option></select><button class="btn">追加 / Add</button></form>${state.media.length?rows(state.media,'media',x=>`<b>${esc(x.title)}</b><div class="en">${esc(x.type)} · ${x.done?'Completed':'Watching / Planned'}</div>`):'<p class="muted">ウォッチリストは空です。 / Your watchlist is empty.</p>'}</div>`;document.querySelector('#body').innerHTML=`<div class="split"><div class="panel"><h2 class="section-title">身体 — Body</h2><div class="metric"><span>水分 / Water</span><b>${state.water}/8</b></div><div class="bar"><div class="fill" style="width:${Math.min(100,state.water/8*100)}%"></div></div><div class="actions" style="margin-top:12px"><button class="btn" data-water="1">+ 1 GLASS</button><button class="btn" data-water="-1">− 1</button></div></div><div class="panel"><b>睡眠 / Sleep</b><div class="big">${state.sleep}h</div><input id="sleep" class="field" type="range" min="0" max="12" step="0.5" value="${state.sleep}"></div></div><div class="panel"><b>運動記録 / Workout log</b><form id="workoutForm" class="formgrid" style="grid-template-columns:1fr auto"><input class="field" name="text" required placeholder="Push / Pull / Run..."><button class="btn">追加 / Add</button></form>${state.workouts.length?state.workouts.map(x=>`<div class="row"><span><b>${esc(x.text)}</b><div class="en">${esc(x.date)}</div></span></div>`).join(''):'<p class="muted">まだ記録なし。 / No workouts logged.</p>'}</div>`;document.querySelector('#timer').innerHTML=`<div class="panel"><h2 class="section-title">集中 — Pomodoro</h2><div id="timerDisplay" class="timer">${String(state.timer.minutes).padStart(2,'0')}:00</div><div class="actions" style="justify-content:center"><button class="btn" data-timer="25">25 MIN</button><button class="btn" data-timer="50">50 MIN</button><button class="btn" id="timerStart">開始 / Start</button><button class="btn" id="timerReset">Reset</button></div><p class="muted" style="text-align:center">一つに集中する。 / Focus on one thing.</p></div><div class="panel"><b>試験カウントダウン / Exam countdown</b><form id="examForm" class="formgrid"><input class="field" name="name" value="${esc(state.exam.name)}" placeholder="試験 / Exam"><input class="field" name="date" type="date" value="${esc(state.exam.date)}"><button class="btn">保存 / Save</button></form><div id="examCountdown" class="countdown" style="margin-top:16px">${examText()}</div></div>`;document.querySelector('#calendar').innerHTML=`<div class="panel"><h2 class="section-title">冬暦 — Winter Calendar</h2><p class="en">01.10.2026 — 31.03.2027 · completed days are marked automatically when all habits are done.</p><div class="xp" style="margin-top:15px">LEVEL ${Math.floor(state.xp/500)+1} · ${state.xp%500}/500 XP</div><div class="bar"><div class="fill" style="width:${state.xp%500/5}%"></div></div><div class="calendar">${winterCalendar()}</div></div>`;document.querySelector('#rules').innerHTML=`<div class="panel"><h2 class="section-title">冬の掟 — Winter Code</h2><p>一、気分ではなく規律で動く。<span class="en"><br>I move by discipline, not mood.</span></p><p>二、小さな約束を守る。<span class="en"><br>Keep the small promises.</span></p><p>三、比較より昨日の自分を超える。<span class="en"><br>Outgrow yesterday, not other people.</span></p><p>四、休息も計画の一部。<span class="en"><br>Recovery is part of the plan.</span></p><p>五、完璧より継続。<span class="en"><br>Consistency over perfection.</span></p></div><div class="panel"><b>開始日 / Start date</b><div class="big">01 · 10 · 2026</div><p>冬は待たない。準備して入る。<span class="en"><br>Winter does not wait. Enter prepared.</span></p><button class="btn danger" data-act="reset">全データをリセット / Reset all data</button></div>`;bind();}
function examText(){if(!state.exam.date)return '日付を設定 / Set an exam date';const t=new Date(state.exam.date+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);const d=Math.ceil((t-n)/86400000);return `${esc(state.exam.name||'Exam')} · ${d>=0?d+' DAYS':'COMPLETED'}`}function winterCalendar(){const start=new Date('2026-10-01T00:00:00'),end=new Date('2027-03-31T00:00:00');let out='',d=new Date(start);for(let i=0;i<start.getDay();i++)out+='<span class="day off"></span>';while(d<=end){const key=d.toISOString().slice(0,10),done=(state.completedDays||[]).includes(key);out+=`<span class="day ${done?'done':''}" title="${key}">${d.getDate()}</span>`;d.setDate(d.getDate()+1)}return out}function rows(a,type,content=x=>`<b>${esc(x.jp)}</b><div class="en">${esc(x.en)}</div>`){return a.map((x,i)=>`<label class="row"><input type="checkbox" data-check="${type}" data-i="${i}" ${x.done?'checked':''}><span>${content(x)}</span></label>`).join('')}function progress(n,p){return `<div style="margin:18px 0"><div>${n} <span class="muted">${p}%</span></div><div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`}
function bind(){document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{const map={habit:'habits',big:'big',study:'study',goal:'goals',media:'media'};state[map[c.dataset.check]][+c.dataset.i].done=c.checked;save();render()});const score=document.querySelector('#score');if(score)score.oninput=()=>{state.score=+score.value;save();render()};document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{state.focus+=+b.dataset.focus;save();render()});document.querySelector('[data-act="quote"]')?.addEventListener('click',()=>{state.quote=(state.quote+1)%quotes.length;save();render()});document.querySelector('[data-act="reset"]')?.addEventListener('click',()=>{if(confirm('Reset all Winter Arc data?')){localStorage.removeItem(SKEY);location.reload()}});form('#studyForm',f=>state.study.push({subject:f.subject.value.trim(),task:f.task.value.trim(),done:false}));form('#goalForm',f=>state.goals.push({text:f.text.value.trim(),done:false}));form('#mediaForm',f=>state.media.push({title:f.title.value.trim(),type:f.type.value,done:false}));document.querySelectorAll('.journal').forEach(t=>t.oninput=()=>{state.journal[t.dataset.j]=t.value;save()});document.querySelectorAll('[data-water]').forEach(b=>b.onclick=()=>{state.water=Math.max(0,Math.min(20,state.water+(+b.dataset.water)));state.xp=Math.max(0,state.xp+(+b.dataset.water>0?5:-5));save();render()});const sl=document.querySelector('#sleep');if(sl)sl.oninput=()=>{state.sleep=+sl.value;save();render()};form('#workoutForm',f=>{state.workouts.push({text:f.text.value.trim(),date:new Date().toLocaleDateString()});state.xp+=50});form('#examForm',f=>{state.exam={name:f.name.value.trim(),date:f.date.value}});document.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>{state.timer.minutes=+b.dataset.timer;save();render()});let timerInt=null,remaining=(state.timer.minutes||25)*60;const td=document.querySelector('#timerDisplay'),ts=document.querySelector('#timerStart'),tr=document.querySelector('#timerReset');if(ts)ts.onclick=()=>{if(timerInt)return;timerInt=setInterval(()=>{remaining--;if(td)td.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');if(remaining<=0){clearInterval(timerInt);timerInt=null;state.focus+=state.timer.minutes;state.xp+=state.timer.minutes;save();alert('集中完了 / Focus complete');render()}},1000)};if(tr)tr.onclick=()=>render();if(state.habits.every(x=>x.done)){const k=new Date().toISOString().slice(0,10);state.completedDays=state.completedDays||[];if(!state.completedDays.includes(k)){state.completedDays.push(k);state.xp+=100;save()}}}function form(sel,fn){const f=document.querySelector(sel);if(f)f.onsubmit=e=>{e.preventDefault();if(!f.reportValidity())return;fn(f);save();render()}}render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;const b=document.querySelector('#installBtn');b.style.display='inline-block';b.onclick=async()=>{deferred.prompt();await deferred.userChoice;b.style.display='none';deferred=null}});
</script></body></html>
